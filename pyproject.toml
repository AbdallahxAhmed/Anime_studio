[project]
name = "anime-studio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=0.23.0",
    "structlog>=25.5.0",
    "textual>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
